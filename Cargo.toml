[package]
name = "bullseye"
version = "0.1.0"
edition = "2024"
description = "A native Rust screenshot and annotation tool for Sway and wlroots"
license = "MIT"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
epaint_default_fonts = "0.32.3"
egui = "0.32.3"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
xkbcommon-dl = "0.4"
rustix = { version = "1", features = ["event"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
tempfile = "3"
wayland-client = { version = "0.31", features = ["system"] }
egui_glow = "0.32.3"
glow = "0.16"
glutin = { version = "0.32.3", default-features = false, features = ["egl", "wayland"] }
raw-window-handle = "0.6"
ashpd = { version = "0.11", default-features = false, features = ["async-std"] }
pollster = "0.4"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
wayland-protocols-misc = { version = "0.3", features = ["client"] }
libc = "0.2"
zbus = { version = "5.19", default-features = false, features = ["async-io", "blocking-api"] }
