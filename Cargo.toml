[package]
name = "bullseye"
version = "0.1.0"
edition = "2024"
description = "A native Rust screenshot and annotation tool for Sway and wlroots"
license = "MIT"

[dependencies]
anyhow = "1"
ab_glyph = "0.2"
epaint_default_fonts = "0.32.3"
eframe = { version = "0.32.3", default-features = false, features = ["default_fonts", "glow", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
tiny-skia = "0.11"
tempfile = "3"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
wl-clipboard-rs = "0.9"

[profile.release]
lto = "thin"
strip = true
